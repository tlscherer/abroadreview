<div class="subscribe-box" style="margin-top: 3em; padding: 2em; background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px;">

  <form id="google-sheet-form">
    <!-- Email Field -->
    <div style="margin-bottom: 1.25em;">
      <label for="email" style="display: block; font-weight: 600; margin-bottom: 0.5em;">Subscribe for Updates (~2/month)</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="you@example.com" 
        required 
        style="width: 100%; max-width: 400px; padding: 0.6em; border: 1px solid #ced4da; border-radius: 4px;"
      >
    </div>

    <!-- Category Checkboxes -->
    <!--

    <div style="margin-bottom: 1.5em;">
      <span style="display: block; font-weight: 600; margin-bottom: 0.5em;">Topics of Interest</span>
      <div style="display: flex; flex-direction: column; gap: 0.4em;">
        <label style="font-weight: normal; cursor: pointer;">
          <input type="checkbox" name="category" value="International Relations"> International Relations
        </label>
        <label style="font-weight: normal; cursor: pointer;">
          <input type="checkbox" name="category" value="Economic Sanctions"> Economic Sanctions
        </label>
        <label style="font-weight: normal; cursor: pointer;">
          <input type="checkbox" name="category" value="Data & R Analysis"> Data & R Analysis
        </label>
      </div>
    </div>
    -->

    <!-- Submit Button & Message -->
    <button 
      type="submit" 
      id="submit-btn" 
      style="padding: 0.6em 1.4em; background-color: #0d6efd; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;"
    >
      Subscribe
    </button>
    
    <div id="form-message" style="margin-top: 1em; display: none; font-weight: 600;"></div>
  </form>
</div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycby6AwallcYohiQucPlJ57u4iYL7Sf-zhUL7bZATcio2gnA9NJ6-X6NDv3Z_SDDMgzC1/exec';
  const form = document.getElementById('google-sheet-form');
  const msg = document.getElementById('form-message');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', e => {
    e.preventDefault();
    btn.disabled = true;
    btn.innerText = 'Submitting...';

    // Collect selected categories into a comma-separated string
    const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked'))
      .map(cb => cb.value)
      .join(', ');

    const formData = new FormData();
    formData.append('email', document.getElementById('email').value);
    formData.append('categories', selectedCategories);

    fetch(scriptURL, { method: 'POST', body: formData })
      .then(response => {
        msg.style.display = 'block';
        msg.style.color = '#198754';
        msg.innerText = 'Thank you! Your email has been added.';
        form.reset();
        btn.disabled = false;
        btn.innerText = 'Subscribe';
      })
      .catch(error => {
        msg.style.display = 'block';
        msg.style.color = '#dc3545';
        msg.innerText = 'Something went wrong. Please try again.';
        btn.disabled = false;
        btn.innerText = 'Subscribe';
      });
  });
</script>
