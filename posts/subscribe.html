<div class="subscribe-box" style="margin-top: 3em; padding: 2em; background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px;">
  <h3 style="margin-top: 0;">Subscribe to Updates</h3>
  <p style="margin-bottom: 1.5em;">Get new posts delivered straight to your inbox. Select the topics you're interested in:</p>

  <form action="https://formspree.io/f/xqpkkkyp" method="POST">
    
    <!-- Email Field -->
    <div style="margin-bottom: 1.25em;">
      <label for="email" style="display: block; font-weight: 600; margin-bottom: 0.5em;">Email Address</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="you@example.com" 
        required 
        style="width: 100%; max-width: 400px; padding: 0.6em; border: 1px solid #ced4da; border-radius: 4px;"
      >
    </div>

    <!-- Category Checkboxes -->
    <div style="margin-bottom: 1.5em;">
      <span style="display: block; font-weight: 600; margin-bottom: 0.5em;">Topics of Interest</span>
      
      <div style="display: flex; flex-direction: column; gap: 0.4em;">
        <label style="font-weight: normal; cursor: pointer;">
          <input type="checkbox" name="category[]" value="International Relations"> International Relations
        </label>
        <label style="font-weight: normal; cursor: pointer;">
          <input type="checkbox" name="category[]" value="Economic Sanctions"> Economic Sanctions
        </label>
        <label style="font-weight: normal; cursor: pointer;">
          <input type="checkbox" name="category[]" value="Data & R Analysis"> Data & R Analysis
        </label>
      </div>
    </div>

    <!-- Submit Button -->
    <button 
      type="submit" 
      style="padding: 0.6em 1.4em; background-color: #0d6efd; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;"
    >
      Subscribe
    </button>

  </form>
</div>
