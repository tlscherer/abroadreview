project:
  type: website
  output-dir: docs

website:
  title: "AbroadReview"
  favicon: images/flags_square.jpg   # little tab icon
  navbar:
    background: '#B31B1B'  # You can change the background color here
    left:
      - text: About
        href: about.qmd
    right:
      - text: "<span class='open-subscribe-modal' style='background-color: #0d6efd; color: white; padding: 4px 10px; border-radius: 4px; font-weight: 600; font-size: 0.85rem; cursor: pointer;'>Subscribe</span>"
