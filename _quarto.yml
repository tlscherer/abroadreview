  # google-analytics:
  #   tracking-id: ""  # Please delete or replace with your own tracking ID
  #   anonymize-ip: true 

  page-footer: 
    left: "Thomas Leo Scherer &copy; <script>document.write(new Date().getFullYear())</script>" 

format:
  html:
    include-after-body: 
      - subscribe.html
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    footnotes-hover: true
    # code-copy: true
    # code-link: true
    # code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    # link-external-filter: '^(?:http:|https:)\/\/drganghe\.github\.io\/custom'
    # include-in-header: "files/includes/_academic.qmd"\
    header-includes: |
      <script defer data-domain="abroadreview.com" src="https://plausible.io/js/script.js"></script>