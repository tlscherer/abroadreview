      - text: "<span style='background-color: #FF6719; color: white; padding: 4px 6px; border-radius: 4px; display: inline-flex; align-items: center;'><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill=white viewBox='0 0 448 512'><path d='M225.9 223.4H0V281h225.9V223.4zM0 338.6h448V512L224 384.8 0 512V338.6zM0 0h448v57.6H0V0z'/></svg></span>"
